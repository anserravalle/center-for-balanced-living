<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MUSA — Essays by Angela Serravalle</title>
<link rel="stylesheet" href="styles.css"/>
</head>
<body class="brand-musa">
<div id="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="Masthead.jsx"></script>
<script type="text/babel" src="LeadEssay.jsx"></script>
<script type="text/babel" src="EssayList.jsx"></script>
<script type="text/babel" src="Article.jsx"></script>
<script type="text/babel" src="BookFeature.jsx"></script>
<script type="text/babel" src="AuthorBio.jsx"></script>
<script type="text/babel" src="MusaFooter.jsx"></script>

<script type="text/babel">
const { useState } = React;
function App() {
  const [view, setView] = useState('archive');
  return (
    <React.Fragment>
      <Masthead view={view} setView={setView} />
      <main>
        {view === 'archive' && (
          <React.Fragment>
            <LeadEssay onOpen={() => setView('article')} />
            <EssayList onOpen={() => setView('article')} />
          </React.Fragment>
        )}
        {view === 'article' && <Article />}
        {view === 'books'   && <BookFeature />}
        {view === 'bio'     && <AuthorBio />}
      </main>
      <MusaFooter />
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body>
</html>
