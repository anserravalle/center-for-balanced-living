<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>CFBL Type</title>
<link rel="stylesheet" href="_card.css"/>
<style>
  .specimen { padding: 6px 4px; }
  .h-display { font-family: 'Cormorant SC', serif; color: #2B5275; font-weight: 500; font-size: 42px; line-height: 1.05; letter-spacing: 0.01em; }
  .h-section { font-family: 'Cormorant SC', serif; color: #2B5275; font-weight: 500; font-size: 24px; line-height: 1.15; margin-top: 6px; }
  .h-body    { font-family: 'Montserrat', sans-serif; color: #1F2A33; font-size: 15px; line-height: 1.55; margin-top: 8px; max-width: 60ch; }
  .h-small   { font-family: 'Montserrat', sans-serif; color: rgba(31,42,51,0.7); font-size: 12px; margin-top: 6px; }
  .row { display: flex; gap: 14px; align-items: baseline; margin-top: 6px; }
  .row .tag { font: 500 10.5px/1 'Inter', sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(31,26,22,0.5); min-width: 92px; }
</style>
</head>
<body style="background:#EED9C5;">
<div class="card">
  <div class="specimen">
    <div class="row"><span class="tag">Display · Cormorant SC</span></div>
    <div class="h-display">Healing Happens In Relationship</div>
    <div class="row"><span class="tag">Section · 24/28</span></div>
    <div class="h-section">Therapy &amp; Psychological Evaluation</div>
    <div class="row"><span class="tag">Body · Montserrat 15</span></div>
    <div class="h-body">We pair evidence-based care with warmth, attunement, and a holistic approach to mind, body, and spirit.</div>
    <div class="h-small">Small text · Montserrat 12 · 70% ink</div>
  </div>
</div>
</body>
</html>
