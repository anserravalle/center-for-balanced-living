<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>MUSA Colors</title>
<link rel="stylesheet" href="_card.css"/>
</head>
<body>
<div class="card">
  <div class="card-grid" style="grid-template-columns: 1fr 1fr;">
    <div class="swatch"><div class="chip" style="background:#6E1F23"></div><div class="meta"><div class="name">Oxblood</div><div class="hex">#6E1F23 · Signature</div></div></div>
    <div class="swatch"><div class="chip" style="background:#C5A572"></div><div class="meta"><div class="name">Ochre</div><div class="hex">#C5A572 · Section rules</div></div></div>
    <div class="swatch"><div class="chip" style="background:#4A4036"></div><div class="meta"><div class="name">Walnut</div><div class="hex">#4A4036 · Bylines</div></div></div>
    <div class="swatch"><div class="chip" style="background:#1F1A16"></div><div class="meta"><div class="name">Ink</div><div class="hex">#1F1A16 · Body</div></div></div>
    <div class="swatch"><div class="chip" style="background:#F1E8D8"></div><div class="meta"><div class="name">Bone</div><div class="hex">#F1E8D8 · Paper ground</div></div></div>
    <div class="swatch"><div class="chip" style="background:#EDE0C8"></div><div class="meta"><div class="name">Parchment</div><div class="hex">#EDE0C8 · Archive ground</div></div></div>
  </div>
</div>
</body>
</html>
