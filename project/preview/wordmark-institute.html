<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Institute Wordmark</title>
<link rel="stylesheet" href="_card.css"/>
<style>
  body { background: #FAFAF7; }
  .row { display: grid; grid-template-columns: 1.4fr 1fr; gap: 0; height: 100%; align-items: stretch; }
  .panel-image {
    position: relative;
    overflow: hidden;
    background: #B8C9BC;
  }
  .panel-image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .tag {
    position: absolute;
    left: 12px;
    bottom: 10px;
    font: 500 9.5px/1 'Inter', sans-serif;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    background: rgba(241, 232, 216, 0.92);
    color: #2B5275;
    padding: 5px 9px;
    border-radius: 2px;
  }
  .panel-alt {
    background: #EAE2D0;
    padding: 22px 22px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 8px;
  }
  .small-caps {
    font-family: 'Cormorant SC', serif;
    color: #2B5275;
    font-weight: 500;
    font-size: 11.5px;
    letter-spacing: 0.08em;
    line-height: 1;
  }
  .wm-main {
    font-family: 'Cormorant Garamond', 'Cormorant SC', serif;
    color: #2B5275;
    font-weight: 500;
    font-size: 28px;
    line-height: 1;
  }
  .tag-italic {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    color: #2B5275;
    font-size: 12.5px;
    line-height: 1.35;
    opacity: 0.9;
    max-width: 28ch;
  }
</style>
</head>
<body>
<div class="card" style="padding:0; height: 100%;">
  <div class="row">
    <div class="panel-image">
      <img src="../assets/institute-logo.png" alt="CFBL Institute lockup"/>
      <span class="tag">Primary lockup</span>
    </div>
    <div class="panel-alt">
      <div class="small-caps">Center for Balanced Living</div>
      <div class="wm-main">CFBL Institute</div>
      <div class="tag-italic">Professional Training in Trauma, Healing, and Integrative Practice</div>
    </div>
  </div>
</div>
</body>
</html>
