<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Brand Family Overview</title>
<link rel="stylesheet" href="_card.css"/>
<style>
  body { background: #FAFAF7; }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0; }
  .tile {
    padding: 22px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 180px;
    justify-content: space-between;
  }
  .tile.cfbl  { background: #EED9C5; color: #2B5275; }
  .tile.inst  { background: #EAE2D0; color: #3D5A52; }
  .tile.musa  { background: #F1E8D8; color: #6E1F23; }
  .badge { font: 500 10px/1 'Inter', sans-serif; text-transform: uppercase; letter-spacing: 0.16em; opacity: 0.75; }
  .name  { font-size: 22px; font-weight: 500; line-height: 1.1; }
  .name.cfbl { font-family: 'Cormorant SC', serif; }
  .name.inst { font-family: 'Cormorant SC', serif; }
  .name.musa { font-family: 'DM Serif Display', serif; }
  .audience { font: 500 11px/1.45 'Inter', sans-serif; opacity: 0.8; }
</style>
</head>
<body>
<div class="card" style="padding:0;">
  <div class="row">
    <div class="tile cfbl">
      <div>
        <div class="badge">Parent Brand</div>
        <div class="name cfbl" style="margin-top:8px;">Center for Balanced Living</div>
      </div>
      <div class="audience">For clients · therapy, evaluation, groups, consultation</div>
    </div>
    <div class="tile inst">
      <div>
        <div class="badge">Teaching Arm</div>
        <div class="name inst" style="margin-top:8px;">CFBL Institute</div>
      </div>
      <div class="audience">For professionals · CE, training, supervision</div>
    </div>
    <div class="tile musa">
      <div>
        <div class="badge">Author Platform</div>
        <div class="name musa" style="margin-top:8px;">MUSA</div>
      </div>
      <div class="audience">For readers · books, essays, publications</div>
    </div>
  </div>
</div>
</body>
</html>
