<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Institute Type</title>
<link rel="stylesheet" href="_card.css"/>
<style>
  .specimen { padding: 6px 4px; }
  .h-display { font-family: 'Cormorant SC', serif; color: #3D5A52; font-weight: 500; font-size: 40px; line-height: 1.1; letter-spacing: 0.01em; }
  .h-section { font-family: 'Cormorant SC', serif; color: #3D5A52; font-weight: 500; font-size: 22px; line-height: 1.18; margin-top: 6px; }
  .h-body    { font-family: 'Lora', Georgia, serif; color: #2A3530; font-size: 16px; line-height: 1.6; margin-top: 8px; max-width: 60ch; }
  .h-utility { font-family: 'Inter', sans-serif; color: #3D5A52; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600; margin-top: 8px; }
  .row { display: flex; gap: 14px; align-items: baseline; margin-top: 6px; }
  .row .tag { font: 500 10.5px/1 'Inter', sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(42,53,48,0.55); min-width: 92px; }
</style>
</head>
<body style="background:#EAE2D0;">
<div class="card">
  <div class="specimen">
    <div class="row"><span class="tag">Display · Cormorant SC</span></div>
    <div class="h-display">Assessment-Informed Trauma Practice</div>
    <div class="row"><span class="tag">Section · 22/26</span></div>
    <div class="h-section">Continuing Education Catalog</div>
    <div class="row"><span class="tag">Body · Lora 16</span></div>
    <div class="h-body">Clinically integrated training in trauma-informed care, taught by a practicing psychologist who carries a clinical caseload.</div>
    <div class="h-utility">Utility · Inter · 6 CE CREDITS · REGISTER</div>
  </div>
</div>
</body>
</html>
