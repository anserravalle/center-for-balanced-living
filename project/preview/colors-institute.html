<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Institute Colors</title>
<link rel="stylesheet" href="_card.css"/>
</head>
<body>
<div class="card">
  <div class="card-grid" style="grid-template-columns: 1fr 1fr;">
    <div class="swatch"><div class="chip" style="background:#3D5A52"></div><div class="meta"><div class="name">Forest</div><div class="hex">#3D5A52 · Anchor</div></div></div>
    <div class="swatch"><div class="chip" style="background:#6F8F7A"></div><div class="meta"><div class="name">Sage</div><div class="hex">#6F8F7A · Primary</div></div></div>
    <div class="swatch"><div class="chip" style="background:#B8C9BC"></div><div class="meta"><div class="name">Sage Mist</div><div class="hex">#B8C9BC · Fields</div></div></div>
    <div class="swatch"><div class="chip" style="background:#C2D7E9"></div><div class="meta"><div class="name">Soft Sky</div><div class="hex">#C2D7E9 · Accent</div></div></div>
    <div class="swatch"><div class="chip" style="background:#EAE2D0"></div><div class="meta"><div class="name">Cream</div><div class="hex">#EAE2D0 · Default ground</div></div></div>
    <div class="swatch"><div class="chip" style="background:#F0EAE0"></div><div class="meta"><div class="name">Paper</div><div class="hex">#F0EAE0 · Light ground</div></div></div>
    <div class="swatch"><div class="chip" style="background:#2A3530"></div><div class="meta"><div class="name">Deep Ink</div><div class="hex">#2A3530 · Body text</div></div></div>
    <div class="swatch" style="opacity:0.6"><div class="chip" style="background:#fff;border-right:1px solid rgba(31,26,22,0.1)"></div><div class="meta"><div class="name">Never pure black</div><div class="hex">Use Deep Ink</div></div></div>
  </div>
</div>
</body>
</html>
