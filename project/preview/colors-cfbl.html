<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>CFBL Colors</title>
<link rel="stylesheet" href="_card.css"/>
</head>
<body>
<div class="card">
  <div class="card-grid" style="grid-template-columns: 1fr 1fr;">
    <div class="swatch"><div class="chip" style="background:#2B5275"></div><div class="meta"><div class="name">Deep Navy</div><div class="hex">#2B5275 · Primary</div></div></div>
    <div class="swatch"><div class="chip" style="background:#4E9FBF"></div><div class="meta"><div class="name">Sky Blue</div><div class="hex">#4E9FBF · Secondary</div></div></div>
    <div class="swatch"><div class="chip" style="background:#EED9C5"></div><div class="meta"><div class="name">Sand</div><div class="hex">#EED9C5 · Background</div></div></div>
    <div class="swatch"><div class="chip" style="background:#9D654E"></div><div class="meta"><div class="name">Terracotta</div><div class="hex">#9D654E · Earth accent</div></div></div>
  </div>
</div>
</body>
</html>
