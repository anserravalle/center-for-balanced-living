<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Spacing</title>
<link rel="stylesheet" href="_card.css"/>
<style>
  .tokens { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 28px; }
  .tok { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center; }
  .tok .bar { height: 8px; background: #2B5275; border-radius: 1px; }
  .tok .name { font: 500 12px/1.2 'Inter', sans-serif; color: #1F1A16; }
  .tok .px   { font: 11px/1 'Inter', sans-serif; color: rgba(31,26,22,0.55); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div class="card">
  <div class="label" style="margin-bottom: 14px;">8-pixel spacing scale</div>
  <div class="tokens">
    <div class="tok"><div class="bar" style="width:4px"></div><div class="name">space-1</div><div class="px">4 px</div></div>
    <div class="tok"><div class="bar" style="width:8px"></div><div class="name">space-2</div><div class="px">8 px</div></div>
    <div class="tok"><div class="bar" style="width:12px"></div><div class="name">space-3</div><div class="px">12 px</div></div>
    <div class="tok"><div class="bar" style="width:16px"></div><div class="name">space-4</div><div class="px">16 px</div></div>
    <div class="tok"><div class="bar" style="width:24px"></div><div class="name">space-5</div><div class="px">24 px</div></div>
    <div class="tok"><div class="bar" style="width:32px"></div><div class="name">space-6</div><div class="px">32 px</div></div>
    <div class="tok"><div class="bar" style="width:48px"></div><div class="name">space-7</div><div class="px">48 px</div></div>
    <div class="tok"><div class="bar" style="width:64px"></div><div class="name">space-8</div><div class="px">64 px</div></div>
    <div class="tok"><div class="bar" style="width:96px"></div><div class="name">space-9</div><div class="px">96 px</div></div>
    <div class="tok"><div class="bar" style="width:128px"></div><div class="name">space-10</div><div class="px">128 px</div></div>
  </div>
</div>
</body>
</html>
