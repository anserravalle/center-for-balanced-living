<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Brand Grounds</title>
<link rel="stylesheet" href="_card.css"/>
<style>
.ground-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.ground {
  border-radius: 4px;
  padding: 22px 20px 24px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 110px;
  border: 1px solid rgba(31,26,22,0.06);
}
.ground .name { font-weight: 500; font-size: 13px; }
.ground .hex  { font-size: 11px; opacity: 0.7; font-variant-numeric: tabular-nums; }
.ground .accent {
  width: 22px; height: 22px; border-radius: 50%;
  margin-top: 4px;
}
</style>
</head>
<body>
<div class="card">
  <div class="label" style="margin-bottom:14px;">Default background grounds — what every page sits on</div>
  <div class="ground-row">
    <div class="ground" style="background:#EED9C5; color:#2B5275;">
      <div>
        <div class="name">CFBL · Sand</div>
        <div class="hex">#EED9C5</div>
      </div>
      <div class="accent" style="background:#2B5275"></div>
    </div>
    <div class="ground" style="background:#EAE2D0; color:#3D5A52;">
      <div>
        <div class="name">Institute · Cream</div>
        <div class="hex">#EAE2D0</div>
      </div>
      <div class="accent" style="background:#3D5A52"></div>
    </div>
    <div class="ground" style="background:#F1E8D8; color:#6E1F23;">
      <div>
        <div class="name">MUSA · Bone</div>
        <div class="hex">#F1E8D8</div>
      </div>
      <div class="accent" style="background:#6E1F23"></div>
    </div>
  </div>
</div>
</body>
</html>
