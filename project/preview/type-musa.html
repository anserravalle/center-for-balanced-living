<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>MUSA Type</title>
<link rel="stylesheet" href="_card.css"/>
<style>
  .specimen { padding: 6px 4px; }
  .h-display { font-family: 'DM Serif Display', serif; color: #1F1A16; font-weight: 400; font-size: 46px; line-height: 1.05; letter-spacing: -0.005em; }
  .h-section { font-family: 'DM Serif Display', serif; color: #1F1A16; font-weight: 400; font-size: 22px; line-height: 1.15; margin-top: 8px; }
  .h-body    { font-family: 'EB Garamond', Georgia, serif; color: #1F1A16; font-size: 17px; line-height: 1.65; margin-top: 8px; max-width: 60ch; }
  .h-byline  { font-family: 'Inter', sans-serif; color: #4A4036; font-size: 11px; text-transform: uppercase; letter-spacing: 0.14em; margin-top: 8px; font-weight: 500; }
  .row { display: flex; gap: 14px; align-items: baseline; margin-top: 6px; }
  .row .tag { font: 500 10.5px/1 'Inter', sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(74,64,54,0.6); min-width: 92px; }
</style>
</head>
<body style="background:#F1E8D8;">
<div class="card">
  <div class="specimen">
    <div class="row"><span class="tag">Display · DM Serif Display</span></div>
    <div class="h-display">On Memory, And Other Inheritances</div>
    <div class="row"><span class="tag">Section · 22/26</span></div>
    <div class="h-section">Essays — Fall Collection</div>
    <div class="row"><span class="tag">Body · EB Garamond 17</span></div>
    <div class="h-body">First-person essayist with a clinical mind. Analytical, direct, intellectually serious, literary without being precious.</div>
    <div class="h-byline">By Angela Serravalle  ·  Issue No. 04</div>
  </div>
</div>
</body>
</html>
