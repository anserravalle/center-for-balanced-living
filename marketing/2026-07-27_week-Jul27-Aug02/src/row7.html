<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts-embedded.css">
<link rel="stylesheet" href="brand.css">
<link rel="stylesheet" href="warm.css">
<style>body{background:#555;display:flex;flex-wrap:wrap;gap:24px;padding:24px;}
 .cfbl-logo{height:60px;width:auto;display:block;}</style></head>
<body>

<!-- BACKGROUND ONLY (no text) -->
<div class="canvas square brand-cfbl warm-bg" data-name="bg">
  <div class="arc arc-1"></div>
  <div class="arc arc-2"></div>
  <img class="branch" src="assets/branch.svg">
</div>

<!-- WITH TEXT -->
<div class="canvas square brand-cfbl warm-bg stack spread center" data-name="text" style="padding:110px 100px;">
  <div class="arc arc-1"></div>
  <div class="arc arc-2"></div>
  <img class="branch" src="assets/branch.svg" style="opacity:0.5;">

  <div style="position:relative;z-index:2;" class="kicker">Center for Balanced Living</div>

  <div class="stack center" style="position:relative;z-index:2;">
    <h1 class="display" style="font-size:118px;line-height:1.02;">Parenting<br>Is Personal.</h1>
    <p class="body b-lg" style="margin-top:34px;font-style:italic;color:var(--cfbl-terracotta);font-size:42px;">It does not have to be isolating.</p>
  </div>

  <div class="stack center" style="position:relative;z-index:2;gap:34px;">
    <hr class="rule-accent">
    <p class="body b-md" style="color:var(--cfbl-deep-navy);letter-spacing:0.02em;">Parenting With Purpose begins August 21.</p>
    <img class="cfbl-logo" src="assets/cfbl-tree-logo.png">
  </div>
</div>

</body></html>
